services:
  server:
    build:
      context: ./backend
    ports:
      - 3000:3000
    env_file: 
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://admin:stayhub@mysql:3306/stayhub
    depends_on:
      mysql:
        condition: "service_healthy"
  mysql:
    image: mysql:8.0
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
